apiVersion: 1
datasources:
  - name: Mimir-tenant-a
    uid: mimir-a
    type: prometheus
    url: http://mimir:9009/prometheus
    jsonData: { httpHeaderName1: X-Scope-OrgID }
    secureJsonData: { httpHeaderValue1: tenant-a }
  - name: Mimir-tenant-b
    uid: mimir-b
    type: prometheus
    url: http://mimir:9009/prometheus
    jsonData: { httpHeaderName1: X-Scope-OrgID }
    secureJsonData: { httpHeaderValue1: tenant-b }
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData: { host: clickhouse, port: 9000, protocol: native, defaultDatabase: telemetry }
