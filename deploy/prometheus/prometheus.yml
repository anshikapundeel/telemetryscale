# Agent mode: scrape loadgen and fleetguard on the host, remote-write to Mimir (tenant-a).
global: { scrape_interval: 5s }
scrape_configs:
  - job_name: loadgen
    static_configs: [{ targets: ["host.docker.internal:2112"] }]
  - job_name: fleetguard
    static_configs: [{ targets: ["host.docker.internal:2113"] }]
remote_write:
  - url: http://mimir:9009/api/v1/push
    headers: { X-Scope-OrgID: tenant-a }
