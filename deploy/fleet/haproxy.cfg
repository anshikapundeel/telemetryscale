global
  log stdout format raw local0
defaults
  mode http
  timeout connect 3s
  timeout client 10s
  timeout server 10s
frontend web
  bind *:8080
  default_backend app
backend app
  balance roundrobin
  server a nginx-a:80 check
  server b nginx-b:80 check
listen stats
  bind *:8404
  stats enable
  stats uri /stats
