# SLO definitions. Burn-rate alert rules are generated from this file.
slos:
  - name: ingest-availability
    objective: 99.9
    window: 30d
    sli:
      good:  'sum(rate(ts_batches_total{result="ok"}[5m]))'
      total: 'sum(rate(ts_batches_total[5m]))'
  - name: ingest-latency
    objective: 99.0
    window: 30d
    sli:
      good:  'sum(rate(ts_batch_seconds_bucket{le="0.25"}[5m]))'
      total: 'sum(rate(ts_batch_seconds_count[5m]))'
burn_rate_windows:
  - { long: 1h,  short: 5m,  factor: 14.4, severity: page }
  - { long: 6h,  short: 30m, factor: 6,    severity: page }
  - { long: 3d,  short: 6h,  factor: 1,    severity: ticket }
