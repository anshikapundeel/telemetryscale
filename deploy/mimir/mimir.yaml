# Single-binary Mimir, monolithic mode, filesystem storage. Multi-tenant ON.
multitenancy_enabled: true
target: all
server:
  http_listen_port: 9009
  log_level: warn
common:
  storage:
    backend: filesystem
    filesystem: { dir: /data/common }
blocks_storage:
  backend: filesystem
  filesystem: { dir: /data/blocks }
  tsdb: { dir: /data/tsdb }
  bucket_store: { sync_dir: /data/tsdb-sync }
compactor: { data_dir: /data/compactor }
ingester:
  ring: { replication_factor: 1 }
store_gateway:
  sharding_ring: { replication_factor: 1 }
ruler_storage:
  backend: filesystem
  filesystem: { dir: /data/rules }
alertmanager_storage:
  backend: filesystem
  filesystem: { dir: /data/alertmanager }
limits:
  max_global_series_per_user: 1500000
runtime_config:
  file: /etc/mimir/runtime.yaml
