name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: SLO rules generate
        run: go run ./cmd/sloctl -o /tmp/rules.yaml && test -s /tmp/rules.yaml
  remediation:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remediation } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -count=1 ./...
